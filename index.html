<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PTE 14-Day Reactivation Course</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#18212f;--muted:#657084;--line:#e4e8ef;--accent:#315efb;--ok:#16845b;--bad:#c53030}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
.container{max-width:1050px;margin:auto;padding:28px 18px 60px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 18px rgba(20,30,50,.05)}
.hero{padding:24px;margin-bottom:18px}h1{margin:0 0 8px;font-size:30px}h2{font-size:22px}h3{margin:0 0 8px}.sub,.small{color:var(--muted)}.bar{height:10px;background:#e8ecf3;border-radius:99px;overflow:hidden;margin:15px 0 6px}.fill{height:100%;width:0;background:var(--accent);transition:.2s}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{padding:18px}.day{cursor:pointer;transition:.15s}.day:hover{transform:translateY(-2px)}.day.active{outline:2px solid var(--accent)}.day.done{border-left:5px solid var(--ok)}
.badge{display:inline-block;padding:4px 9px;border-radius:99px;background:#edf2ff;color:#2346b8;font-size:12px;font-weight:700}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--accent);color:white}button.secondary{background:#edf0f5;color:#263247}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.status{margin-top:12px;color:var(--muted);font-size:14px}
input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;background:white}textarea{min-height:110px;resize:vertical}
.flash{min-height:145px;display:flex;align-items:center;justify-content:center;text-align:center;border:2px dashed #cfd6e3;border-radius:14px;padding:20px;font-size:27px;font-weight:800;cursor:pointer;background:#fbfcff}
.result{padding:12px;border-radius:10px;background:#f7f8fb;margin-top:10px}.ok{color:var(--ok);font-weight:800}.bad{color:var(--bad);font-weight:800}
table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
@media(max-width:600px){h1{font-size:24px}.container{padding:18px 12px 45px}}
</style></head><body><div class="container">
<section class="hero"><span class="badge">PTE Academic · 14-Day Reactivation</span>
<h1>14天 PTE 词汇与语言恢复课程</h1>
<p class="sub">目标：恢复此前语言状态，再把词汇转化为 Reading / Listening / Speaking / Writing 的主动能力。每天约70分钟地铁碎片时间；晚上任务可选。</p>
<div class="bar"><div id="progress" class="fill"></div></div><div id="progressText" class="small">0 / 14 天完成</div></section>
<section class="card" style="margin-bottom:18px"><h2>使用方法</h2>
<p><b>早班车 35 min：</b>输入、词汇识别、听辨。</p><p><b>晚班车 35 min：</b>主动回忆、搭配、Speaking / PTE应用。</p>
<p><b>每天打卡：</b>完成当天任务后点击“完成 Day”。进度保存在当前浏览器。</p></section>
<section><h2>14-Day Roadmap</h2><div id="days" class="grid"></div></section>
<section id="lesson" class="card" style="margin-top:18px"><h2 id="lessonTitle"></h2><p id="lessonDesc" class="sub"></p>
<div class="controls"><button onclick="prevDay()">← 上一天</button><button onclick="nextDay()">下一天 →</button><button class="secondary" onclick="toggleDone()">✓ 完成 Day</button></div>
<div id="lessonBody" style="margin-top:20px"></div><div id="doneStatus" class="status"></div></section>
</div>
<script>
const days=[["Day 1", "Vocabulary Reactivation", "25 core academic words + 10 collocations", "Recognition → recall → 45-second speaking"], ["Day 2", "Academic Core", "30–35 research, education and academic words", "English → Chinese → active sentence"], ["Day 3", "Word Families", "25–30 high-value word families", "Verb → noun → adjective → adverb"], ["Day 4", "Collocations", "30 high-frequency academic collocations", "Build natural chunks"], ["Day 5", "Cause & Effect", "25 cause/effect verbs and phrases", "Facilitate, enhance, contribute, undermine, inhibit"], ["Day 6", "Logic & Connectors", "20–25 logical connectors", "Contrast, cause, addition, consequence"], ["Day 7", "Mini Retest 1", "Review Days 1–6", "Vocabulary + collocation + FIB + speaking"], ["Day 8", "Science & Environment", "30–35 science/environment words", "Reading/listening recognition + speaking"], ["Day 9", "Education & Society", "30–35 education/social-policy words", "60-second opinion response"], ["Day 10", "Technology & Economy", "30–35 technology/economy words", "Academic sentence production"], ["Day 11", "Speaking Activation", "Review high-value active vocabulary", "RA + RS + 60-second response"], ["Day 12", "Writing Activation", "Review academic vocabulary/collocations", "Mini essay with controlled target vocabulary"], ["Day 13", "Mixed PTE Practice", "Mixed vocabulary in PTE tasks", "FIB + listening + speaking + writing"], ["Day 14", "Final Retest", "150-word sample + collocations + word families", "Measure recovery and identify next-stage gaps"]];const day1Words=[["assess", "评估", "assess the effectiveness"], ["acquire", "获得；习得", "acquire knowledge"], ["cognitive", "认知的", "cognitive skills"], ["comprehend", "理解", "comprehend information"], ["capacity", "能力；容量", "cognitive capacity"], ["demonstrate", "证明；展示", "demonstrate the ability"], ["evidence", "证据", "substantial evidence"], ["establish", "建立；确定", "establish a relationship"], ["evaluate", "评价；评估", "evaluate the effectiveness"], ["variation", "变化；差异", "individual variation"], ["facilitate", "促进；使更容易", "facilitate learning"], ["enhance", "增强；提高", "enhance cognitive function"], ["contribute", "促成；贡献", "contribute to development"], ["indicate", "表明", "indicate that..."], ["identify", "识别；确定", "identify factors"], ["implement", "实施", "implement a policy"], ["maintain", "维持", "maintain stability"], ["ensure", "确保", "ensure survival"], ["require", "要求；需要", "require attention"], ["promote", "促进；推动", "promote learning"], ["substantial", "大量的；重大的", "substantial evidence"], ["significant", "显著的；重要的", "significant impact"], ["fundamental", "根本的；基础的", "fundamental skills"], ["essential", "必不可少的", "essential skills"], ["apparent", "明显的", "apparent differences"]];let current=0;let done=JSON.parse(localStorage.getItem("pte14_done")||"[]");let flashIndex=0,flipped=false;
function renderDays(){document.getElementById("days").innerHTML=days.map((d,i)=>`<div class="card day ${i===current?'active':''} ${done.includes(i)?'done':''}" onclick="selectDay(${i})"><span class="badge">${d[0]}</span><h3>${d[1]}</h3><p class="small">${d[2]}</p><p class="small">${d[3]}</p><div class="small">${done.includes(i)?"✓ 已完成":"未完成"}</div></div>`).join("");let p=Math.round(done.length/14*100);document.getElementById("progress").style.width=p+"%";document.getElementById("progressText").textContent=`${done.length} / 14 天完成 · ${p}%`}
function selectDay(i){current=i;renderLesson();renderDays();window.scrollTo({top:document.getElementById("lesson").offsetTop-15,behavior:"smooth"})}
function prevDay(){if(current>0)selectDay(current-1)}function nextDay(){if(current<13)selectDay(current+1)}
function toggleDone(){if(done.includes(current))done=done.filter(x=>x!==current);else done.push(current);localStorage.setItem("pte14_done",JSON.stringify(done));renderDays();renderLesson()}
function renderLesson(){let d=days[current];document.getElementById("lessonTitle").textContent=d[0]+" · "+d[1];document.getElementById("lessonDesc").textContent=d[2]+" · "+d[3];document.getElementById("doneStatus").innerHTML=done.includes(current)?"<span class='ok'>✓ 今天已打卡</span>":"今天尚未打卡";if(current===0)renderDay1();else renderGeneric()}
function renderDay1(){document.getElementById("lessonBody").innerHTML=`<div class="grid"><div class="card"><h3>🚇 早班车 · 35 min</h3><p>20 min 核心词；10 min 搭配；5 min 快速回忆。</p></div><div class="card"><h3>🚇 晚班车 · 35 min</h3><p>中文→英文；搭配；8个句子；45秒Speaking。</p></div></div>
<div style="margin-top:18px"><h3>① Flashcards</h3><div id="flash" class="flash" onclick="flipCard()"></div><div class="controls"><button class="secondary" onclick="prevCard()">←</button><button class="secondary" onclick="flipCard()">翻转</button><button onclick="nextCard()">→</button></div><div id="flashMeta" class="status"></div></div>
<div style="margin-top:22px"><h3>② Recall Check</h3><p>中文：<b id="promptCn"></b></p><input id="recall" placeholder="输入英文单词"><div class="controls"><button onclick="checkRecall()">检查</button></div><div id="recallResult"></div></div>
<div style="margin-top:22px"><h3>③ PTE Sentence Completion</h3><p>Researchers need to <b>______</b> the effectiveness of the program.</p><input id="fib" placeholder="输入一个单词"><div class="controls"><button onclick="checkFib()">检查</button></div><div id="fibResult"></div></div>
<div style="margin-top:22px"><h3>④ Speaking Challenge</h3><p><b>Why is education important for individuals and society?</b></p><p class="small">目标：45秒；至少主动使用5个 Day 1 词。</p><textarea placeholder="可以先写关键词，再进行口头回答。"></textarea><p class="small">建议词：essential · acquire · cognitive · facilitate · enhance · contribute · promote</p></div>
<div style="margin-top:22px"><h3>⑤ Day 1 Checklist</h3><label><input type="checkbox"> 25个核心词完成第一轮</label><br><br><label><input type="checkbox"> 10个collocations完成</label><br><br><label><input type="checkbox"> 中文→英文recall完成</label><br><br><label><input type="checkbox"> 45秒Speaking完成</label></div>`;flashIndex=0;flipped=false;updateFlash()}
function flipCard(){flipped=!flipped;updateFlash()}function nextCard(){flashIndex=(flashIndex+1)%day1Words.length;flipped=false;updateFlash()}function prevCard(){flashIndex=(flashIndex-1+day1Words.length)%day1Words.length;flipped=false;updateFlash()}
function updateFlash(){let w=day1Words[flashIndex];document.getElementById("flash").innerHTML=flipped?`${w[1]}<div class="small" style="display:block;margin-top:10px">${w[2]}</div>`:w[0];document.getElementById("flashMeta").textContent=`${flashIndex+1} / ${day1Words.length}`;document.getElementById("promptCn").textContent=day1Words[(flashIndex+3)%day1Words.length][1]}
function checkRecall(){let t=day1Words[(flashIndex+3)%day1Words.length][0].toLowerCase(),v=document.getElementById("recall").value.trim().toLowerCase();document.getElementById("recallResult").innerHTML=v===t?`<div class="result ok">✓ Correct — ${t}</div>`:`<div class="result bad">✗ 正确答案：<b>${t}</b></div>`}
function checkFib(){let v=document.getElementById("fib").value.trim().toLowerCase();document.getElementById("fibResult").innerHTML=v==="assess"?`<div class="result ok">✓ Correct — assess the effectiveness</div>`:`<div class="result bad">✗ 正确答案：<b>assess</b>。这里需要“评估”。</div>`}
function renderGeneric(){document.getElementById("lessonBody").innerHTML=`<div class="grid"><div class="card"><h3>🚇 早班车</h3><p>${days[current][2]}</p><p class="small">20 min 输入 + 10 min recall + 5 min review。</p></div><div class="card"><h3>🚇 晚班车</h3><p>${days[current][3]}</p><p class="small">完成后点击“完成 Day”打卡。</p></div></div><div style="margin-top:18px" class="card"><h3>今日记录</h3><textarea id="notes" placeholder="记录今天最容易忘的词、搭配、错误类型或Speaking问题。"></textarea><div class="controls"><button onclick="saveNotes()">保存今日记录</button></div><div id="noteStatus" class="status"></div></div><div style="margin-top:18px"><h3>阶段路线</h3><table><tr><th>阶段</th><th>重点</th></tr><tr><td>Days 1–6</td><td>恢复词汇、词族、搭配和逻辑</td></tr><tr><td>Day 7</td><td>第一次诊断，不新增大量内容</td></tr><tr><td>Days 8–10</td><td>主题词汇 + PTE语境</td></tr><tr><td>Days 11–13</td><td>Speaking / Writing / Mixed PTE</td></tr><tr><td>Day 14</td><td>最终复测，决定下一阶段重点</td></tr></table></div>`;document.getElementById("notes").value=localStorage.getItem("pte_note_"+current)||""}
function saveNotes(){localStorage.setItem("pte_note_"+current,document.getElementById("notes").value);document.getElementById("noteStatus").innerHTML="<span class='ok'>✓ 已保存到本设备</span>"}
renderDays();renderLesson();
</script></body></html>
